# Données exposées ici en surcharge du profil local. Le datasource en
# production est fourni par docker-compose.yml via SPRING_DATASOURCE_*.
server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sup2i:
  security:
    cors:
      enabled: ${SUP2I_CORS_ENABLED:false}
      allowed-origins: ${SUP2I_CORS_ALLOWED_ORIGINS:}
      max-age: 1h