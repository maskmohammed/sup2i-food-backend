spring:
  application:
    name: sup2i-food-backend

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

sup2i:
  security:
    local-provider-code: local

    jwt:
      issuer: sup2i-food-backend
      access-token-ttl: 15m
      secret-base64: ${SUP2I_JWT_SECRET_BASE64}

    refresh-token-ttl: 30d

  loyalty:
    mad-per-point: 10
    points-per-reward: 100
    reward-value-mad: 5.00

    login-protection:
      enabled: true
      max-failed-attempts: 5
      failure-window: 15m
    mfa:
      enabled: true
      required-roles:
        - ADMINISTRATION
        - SYSTEM_ADMIN
      encryption-key-base64: ${SUP2I_MFA_ENCRYPTION_KEY_BASE64}
      recovery-code-count: 10
    cors:
      enabled: ${SUP2I_CORS_ENABLED:false}
      allowed-origins: ${SUP2I_CORS_ALLOWED_ORIGINS:}
      max-age: 1h